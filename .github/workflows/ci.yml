name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build (SwiftLint plugin runs here)
        run: swift build
      - name: Test
        run: swift test
      - name: Lint, warnings fail
        run: swift package plugin --allow-writing-to-package-directory swiftlint --strict --reporter github-actions-logging
